<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Coral Bay Heat — an open-world crime game: steal cars, run missions, drive taxi fares, outrun a 5-star wanted system.">
<title>Coral Bay Heat — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17303a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Coral Bay Heat: explore a sun-soaked city on foot and by car, steal cars, run missions, drive taxi fares, outrun the police"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
